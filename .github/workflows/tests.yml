name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: signaldb_test
          POSTGRES_USER: signaluser
          POSTGRES_PASSWORD: signalpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U signaluser -d signaldb_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------
      # Conan cache
      # ---------------------------
      - name: Cache Conan packages
        uses: actions/cache@v3
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # ---------------------------
      # Conan
      # ---------------------------
      - name: Install Conan 2
        run: |
          pip install conan==2.22.2
          conan --version

      - name: Detect Conan profile
        run: conan profile detect --force

      # ---------------------------
      # Install dependencies
      # ---------------------------
      - name: Conan install (Release)
        run: |
          conan install . \
            --build=missing \
            -s compiler.cppstd=20

      # ---------------------------
      # Build tools
      # ---------------------------
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      # ---------------------------
      # Sanity check
      # ---------------------------
      - name: Verify toolchain
        run: |
          test -f build/Release/generators/conan_toolchain.cmake
          echo "Conan toolchain found"

      # ---------------------------
      # Configure
      # ---------------------------
      - name: Configure CMake (tests)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DBUILD_TESTS=ON

      # ---------------------------
      # Build
      # ---------------------------
      - name: Build
        run: cmake --build build -j

      # ---------------------------
      # Init DB schema
      # ---------------------------
      - name: Init database schema
        env:
          PGPASSWORD: signalpass
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
          # Wait for Postgres explicitly
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U signaluser -d signaldb_test && break
            sleep 1
          done

          psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U signaluser \
            -d signaldb_test \
            -f db/init.sql

      # ---------------------------
      # Run tests
      # ---------------------------
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure